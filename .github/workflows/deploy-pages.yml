name: Deploy Pages
on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: latest
            - uses: actions/setup-node@v6
              with:
                  cache: pnpm
                  node-version: 24
            - run: pnpm install
            - run: pnpm build:site
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site-dist
            - uses: actions/deploy-pages@v4
              id: deployment
