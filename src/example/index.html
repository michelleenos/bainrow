<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bainrow Palettes</title>
	</head>
	<body class="hide-contexts">
		<div class="topbar">
			<h1><span>b</span>ain<span>r</span>ow</h1>

			<div class="topbar-controls">
				<div class="control-wrap col1">
					<input type="checkbox" id="br-toggle-pairs" />
					<label for="br-toggle-pairs">Show Pairs</label>
				</div>
				<div class="control-wrap col1">
					<input type="checkbox" id="br-toggle-contexts" />
					<label for="br-toggle-contexts">Show Contexts</label>
				</div>

				<div class="control-wrap context-control col1">
					<input type="checkbox" id="br-toggle-stroke" />
					<label for="br-toggle-stroke">Show Stroke</label>
				</div>
				<div class="control-wrap context-control use-contrast-check">
					<input type="checkbox" id="br-use-contrast" />
					<label for="br-use-contrast">Use Min Contrast</label>
				</div>
				<div class="control-wrap context-control num-control-wrap contrast-input">
					<label for="br-contrast">Min Contrast</label>
					<input type="number" step="0.1" min="0" max="14" id="br-contrast" />
				</div>

				<div class="control-wrap context-control bg-shade-select">
					<label for="br-bg-shade">BackgroundShade</label>
					<select id="br-bg-shade">
						<option value=""></option>
						<option value="light">Light</option>
						<option value="dark">Dark</option>
					</select>
				</div>
				<div class="control-wrap context-control bg-shade-limit">
					<label for="br-bg-shade-limit">Limit</label>
					<input type="number" step="1" min="0" max="255" id="br-bg-shade-limit" />
				</div>
				<!-- <button class="br-toggle-pairs">Toggle Pairs</button>
				<button class="br-toggle-contexts">Toggle Contexts</button>
				<button class="br-toggle-stroke">Toggle Stroke</button>

				<div class="br-contrast-stuff">
					<label for="br-use-contrast">
						Use min contrast
						<input type="checkbox" id="br-use-contrast" />
					</label>
					<label for="br-contrast">
						Min Contrast
						<input type="number" step="0.1" min="0" max="14" id="br-contrast" />
					</label>
				</div> -->
			</div>
		</div>

		<div class="palette-examples"></div>

		<script type="module" src="./example-main.ts"></script>
	</body>
</html>
